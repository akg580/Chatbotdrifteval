services:
  - type: web
    name: sentinel-compliance-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --worker-class gthread --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: EVAL_API_KEY
        sync: false          # set manually in Render dashboard
      - key: SKIP_LLM_PROBE
        value: "1"           # skip slow probe on cold start
      - key: CORS_ORIGINS
        sync: false          # set to your Netlify URL after deploy
      - key: MAX_DATASET_COUNT
        value: "50"
      - key: MAX_MESSAGE_LEN
        value: "2000"
      - key: FLASK_DEBUG
        value: "0"